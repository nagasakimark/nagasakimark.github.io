<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えいごゲームひろば</title>
<link rel="icon" href="/games/images/icon.svg" type="image/svg+xml">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<noscript><p><a href="/games/">えいごゲームひろば はこちら</a></p></noscript>
<script>
/* Shows the /games/ page right here, so this address is always identical to /games/. */
fetch("/games/", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw 0; return r.text(); })
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(() => location.replace("/games/"));
</script>
</body>
</html>
